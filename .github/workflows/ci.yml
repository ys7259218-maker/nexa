name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install smoke-test browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Appointment real-auth staging harness (skips without credentials)
        run: npm run test:integration:appointments

      - name: Production-readiness guard (non-production build stays usable)
        run: npm run check:production-build

      - name: Production-readiness guard blocks unreviewed production builds
        shell: bash
        run: |
          set +e
          VERCEL_ENV=production npm run check:production-build >/tmp/guard.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "production-readiness guard did not block an unreviewed production build" >&2
            exit 1
          fi
          echo "production-readiness guard correctly blocked an unreviewed production build"

      - name: Production build
        env:
          # Public staging project address and deliberately nonfunctional test key;
          # no real Auth credentials or service-role key are used in this CI job.
          NEXT_PUBLIC_SUPABASE_URL: https://vbizuxxgjlwqotuegskq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-smoke-only-not-a-real-key
        run: npm run build

      - name: Browser smoke tests
        run: npm run test:smoke:run

      - name: Preview-only enabled-gate HTTP smoke (synthetic; no database write)
        env:
          APPOINTMENT_REVIEW_STAGING_ENABLED: "true"
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://vbizuxxgjlwqotuegskq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-smoke-only-not-a-real-key
          NEXA_SMOKE_GUARD_ENABLED: "true"
          NEXA_SMOKE_SPEC: tests/smoke/appointment-review-on-guards.spec.ts
        run: npm run test:smoke:run

  tracked-secret-guard:
    name: Tracked-secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Inspect tracked files for secrets
        run: npm run check:tracked-secrets

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

  migration-replay:
    name: Local migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The disposable hosted runner has no linked project or hosted credentials.
      # The checked-in verifier refuses linked checkouts, resets only --local,
      # applies the canonical chain twice, then lints and lists local migrations.
      - name: Verify canonical migration replay twice
        run: npm run verify:supabase:local

      # Reset the same disposable runner to a clean canonical state, then
      # replay only the tracked staging appointment overlay. No hosted SQL.
      - name: Verify staging appointment overlay replay
        run: npm run verify:supabase:staging-overlay
